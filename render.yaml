# ─── Blueprint استقرار بازی SPY روی Render.com ───
# دو روش استفاده:
#   ۱) در Render: New + → Blueprint → انتخاب این ریپو → Render خودش تنظیمات زیر را اعمال می‌کند.
#   ۲) دستی: New + → Web Service و مقادیر زیر را در فرم وارد کنید (docs/DEPLOY_RENDER.md).

services:
  - type: web
    name: spy-game
    runtime: node
    plan: free              # برای دیسک پایدار SQLite روی starter تغییر دهید
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        # حیاتی: درایور node:sqlite از نسخهٔ ۲۲.۱۳ به بالا بدون فلگ فعال است
        value: 22.17.0
      - key: SECRET
        # کلید امضای توکن هویت — یک‌بار ساخته و ثابت می‌ماند؛ تغییرش همهٔ لاگین‌ها را باطل می‌کند
        generateValue: true
      - key: SERVE_CLIENT
        # فرانت هم از همین سرویس ارائه می‌شود → بازی کامل روی یک URL
        value: "1"
    # ─── فقط روی پلن پولی (Starter به بالا): دیسک پایدار برای SQLite ───
    # disk:
    #   name: spy-data
    #   mountPath: /data
    #   sizeGB: 1
    # و این متغیر را به envVars اضافه کنید:
    # - key: DB_PATH
    #   value: /data/spy.db
