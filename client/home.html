<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>بازی جاسوس SPY — صفحه اصلی</title>
<meta name="theme-color" content="#0b0817"/>
<link rel="icon" href="favicon.svg"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <header class="topbar"></header>
  <div class="card anim-in" id="welcome-card" style="display:none">
    <div class="row-between">
      <div>
        <div style="font-size:17px;font-weight:900" id="hello-name"></div>
        <div class="muted small" id="entries-info"></div>
      </div>
      <div id="hello-avatar"></div>
    </div>
  </div>
  <div class="menu-grid" id="menu">
    <button class="menu-item wide" data-go="create.html">
      <span class="mi-icon gold" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
      <span><span class="mi-title">ساخت لابی جدید</span><br/><span class="mi-sub">اتاق بساز، دوستانت را با کد دعوت کن</span></span>
    </button>
    <button class="menu-item" data-go="join.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="14" r="4"/><path d="M11 11 20 2M17 5l3 3"/></svg></span>
      <span class="mi-title">ورود با کد لابی</span>
    </button>
    <button class="menu-item" data-go="ttt.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></span>
      <span class="mi-title">بازی دوز</span><span class="mi-sub" style="font-size:11.5px;color:var(--muted)">کسب سکه</span>
    </button>
    <button class="menu-item" data-go="shop.html">
      <span class="mi-icon gold" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#f5c542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></span>
      <span class="mi-title">فروشگاه آواتار</span>
    </button>
    <button class="menu-item" data-go="profile.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
      <span class="mi-title">پروفایل</span>
    </button>
    <button class="menu-item" data-go="history.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
      <span class="mi-title">تاریخچه بازی‌ها</span>
    </button>
    <button class="menu-item" data-go="guide.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M8 7h7M8 11h5"/></svg></span>
      <span class="mi-title">راهنمای بازی</span>
    </button>
    <button class="menu-item" data-go="settings.html">
      <span class="mi-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#b9b0d6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.5-2-3.5-2.3 1a7 7 0 0 0-2.7-1.6L13.5 2h-3L10 4.8a7 7 0 0 0-2.7 1.6l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 3.2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 2.7 1.6L10.5 22h3l.5-2.8a7 7 0 0 0 2.7-1.6l2.3 1 2-3.5-2-1.5c.13-.52.2-1.06.2-1.6Z"/></svg></span>
      <span class="mi-title">تنظیمات صدا و ظاهر</span>
    </button>
  </div>
</div>
<script src="config.js"></script>
<script src="vendor/socket.io.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/home.js"></script>
</body>
</html>
