<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>بازی جاسوس SPY — ورود</title>
<meta name="theme-color" content="#0b0817"/>
<link rel="icon" href="favicon.svg"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="stars"></div>
<div class="container">
  <div class="hero anim-in">
    <img class="logo-big" src="logo.svg" alt="لوگوی بازی جاسوس SPY"/>
    <h1>بازی جاسوس</h1>
    <p>کلمهٔ مخفی بین شهروندهاست؛ جاسوس بین‌شان پنهان شده.<br/>گوش کن، بپرس، حدس بزن!</p>
  </div>
  <div class="card anim-in" id="enter-card">
    <div class="field">
      <label for="name-input">اسمت چیه؟</label>
      <input class="input" id="name-input" maxlength="16" placeholder="مثلاً: آقای مرموز" autocomplete="off"/>
      <div class="hint">بدون ثبت‌نام و رمز عبور — با همین نام وارد می‌شوی و هویتت روی دستگاهت می‌ماند.</div>
    </div>
    <button class="btn btn-gold btn-lg btn-block" id="enter-btn">ورود به بازی</button>
    <div id="enter-msg" class="hint" role="status"></div>
  </div>
  <p class="center muted small" style="margin-top:14px">شروع: ۶۰ سکه هدیه + ۴ ورود رایگان به لابی</p>
</div>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/index.js"></script>
</body>
</html>
